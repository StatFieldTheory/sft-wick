name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v

  # Wall-clock gate for the shipped examples: the CPC referee could not get
  # output from the quick start within an hour.  The quickstart must finish
  # in 10 minutes on a stock runner and the full demo1 sweep in 20; both
  # print progress bars (text fallback: stderr is not a TTY here).
  examples-time-gate:
    name: Example run-time gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (no optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Quick start must finish within 600 s
        env:
          SFT_WICK_PROGRESS: "1"
        run: |
          cd "$(mktemp -d)"
          time timeout 600 sft-wick quickstart

      - name: examples/demo1_config.yaml must finish within 1200 s
        env:
          SFT_WICK_PROGRESS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          time timeout 1200 sft-wick run examples/demo1_config.yaml

  build:
    name: Build & check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "from sft_wick import compute_moment; print('import OK')"
          /tmp/smoke/bin/sft-wick --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/
