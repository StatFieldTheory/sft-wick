name: Mutation sweep

# The mutation sweep of tools/mutations/ against the local default suite,
# by hand only: one full run of the suite per mutant, split into shards.
# Each shard uploads its --json report; joined in corpus order, the reports
# are what tools/kill_matrix.py turns into docs/verification/kill_matrix.json.
# The last step of a shard fails if a mutant was left in src/.
on:
  workflow_dispatch:

# Its own group, so a push to the ref does not cancel a sweep.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Mutation sweep (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the shard's mutants against the local default suite
        continue-on-error: true
        run: >-
          python tools/mutation_check.py --matrix
          --tests "tests/ -n auto --dist worksteal"
          --shard ${{ matrix.shard }}/6
          --json kills-${{ matrix.shard }}.json

      - name: The source holds no mutant
        if: always()
        run: git diff --exit-code -- src/

      - name: Upload the shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-kills-${{ matrix.shard }}
          path: kills-${{ matrix.shard }}.json
          if-no-files-found: warn
