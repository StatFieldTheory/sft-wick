[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-wick"
version = "0.7.0"
description = "Wick's theorem contractions for statistical field theory perturbative calculations"
readme = "README.md"
authors = [{ name = "Zheng Zhang", email = "zzhang0123@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "joblib>=1.3",
]

[project.scripts]
sft-wick = "sft_wick.workflow.cli:main"

[project.urls]
Homepage = "https://github.com/StatFieldTheory/sft-wick"
Repository = "https://github.com/StatFieldTheory/sft-wick"
Documentation = "https://sft-wick.readthedocs.io"

[project.optional-dependencies]
parallel = [
    "joblib>=1.3",
]
progress = [
    "tqdm>=4.60",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # Runs the suite on several processes (pytest -n auto --dist worksteal).
    # 3.6 runs each test in the worker's main thread, which the SIGALRM
    # hang guards in the tests need.
    "pytest-xdist>=3.6",
    # docs/verification/catalog.rst advertises "60-digit mpmath at the branch
    # boundary" as demo 3's independent reference, but the test obtains it via
    # pytest.importorskip.  Undeclared, that check silently SKIPPED in CI while
    # passing on any developer machine that happened to have mpmath -- the
    # catalogue claiming a verification that never ran.
    "mpmath>=1.3",
    # The workflow JSON Schema is checked with the reference validator
    # (tests/test_workflow_schema.py, test_workflow_corpora.py); the package
    # itself does not import it.
    "jsonschema>=4.0",
    # Property tests of the fuzzer's sampler (tests/test_validation_draw.py).
    "hypothesis>=6.0",
    # The fuzzer in validation/ reads the resident memory of its processes.
    "psutil>=5.9",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "nbsphinx>=0.9",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sft_wick"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean: ship the package, tests, docs source,
# and example scripts/configs, but exclude regenerable / heavy binary
# outputs (rendered notebooks, generated figures, simulation caches).
exclude = [
    ".agents/",
    ".agent-state/",
    ".hypothesis/",
    "docs/research/",
    "examples/**/*.ipynb",
    "examples/**/*.pdf",
    "examples/**/*.npz",
    "examples/**/*.pkl",
    "examples/**/figures/",
    "docs/_build/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running performance benchmarks (deselected by default)",
    "heavy: correctness tests that take 10 s or more each (deselected by default; CI runs them with -m 'not slow')",
]
addopts = "-m 'not slow and not heavy'"
