[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-wick"
version = "0.1.0"
description = "Wick's theorem contractions for statistical field theory perturbative calculations"
readme = "README.md"
authors = [{ name = "Zheng Zhang", email = "zzhang0123@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "joblib>=1.3",
]

[project.scripts]
sft-wick = "sft_wick.workflow.cli:main"

[project.urls]
Homepage = "https://github.com/StatFieldTheory/sft-wick"
Repository = "https://github.com/StatFieldTheory/sft-wick"
Documentation = "https://sft-wick.readthedocs.io"

[project.optional-dependencies]
parallel = [
    "joblib>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "nbsphinx>=0.9",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sft_wick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running performance benchmarks (deselected by default)",
]
addopts = "-m 'not slow'"
